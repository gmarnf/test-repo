      padding: 24px 16px;

    }

      font-size: 18px;

    }

      color: white;
      text-decoration: none;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    aside a.active, aside a:hover {
      background: rgba(255,255,255,0.1);
    }
    main {
      flex: 1;
      padding: 32px;
    }
    .header {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 24px;
    }

      padding: 16px;
      border-radius: var(--radius);
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 32px;
      display: inline-block;
    }
